name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  # Daily rebuild so posts dated in the future publish on their date.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECTIFIA_59A1E }}
          channelId: live
          projectId: rectifia-59a1e
